name: Release Theme

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Verify version
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          THEME_VERSION=$(grep -Po "^Version:\s*\K.*" style.css | tr -d '\r')
          PHP_VERSION=$(grep -Po "ASOSYOLOJI_VERSION',\s*'\K[^']+" functions.php)

          test "$TAG_VERSION" = "$THEME_VERSION"
          test "$TAG_VERSION" = "$PHP_VERSION"

      - name: Build theme ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/asosyoloji
          rsync -a ./ build/asosyoloji/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'build' \
            --exclude '.gitignore' \
            --exclude 'plugin'

          cd build
          zip -qr asosyoloji-theme.zip asosyoloji
          unzip -t asosyoloji-theme.zip

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/asosyoloji-theme.zip \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
