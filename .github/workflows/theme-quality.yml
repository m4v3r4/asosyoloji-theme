name: Theme Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './vendor/*' -print0 |
            xargs -0 -n1 php -l

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax check
        shell: bash
        run: |
          set -euo pipefail
          find assets/js -type f -name '*.js' -print0 |
            xargs -0 -n1 node --check

  phpcs:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none

      - name: Install coding standards
        run: composer install --no-interaction --prefer-dist

      - name: WordPress Coding Standards report
        run: composer phpcs

  package:
    runs-on: ubuntu-latest
    needs: syntax
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build installable ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/asosyoloji
          rsync -a ./ build/asosyoloji/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'build' \
            --exclude '.gitignore' \
            --exclude 'composer.json' \
            --exclude 'composer.lock' \
            --exclude 'phpcs.xml.dist' \
            --exclude 'bin' \
            --exclude 'vendor' \
            --exclude 'node_modules'
          cd build
          zip -qr asosyoloji-theme.zip asosyoloji

      - name: Verify ZIP
        shell: bash
        run: |
          test -s build/asosyoloji-theme.zip
          unzip -t build/asosyoloji-theme.zip


  wordpress-smoke:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP and WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none
          tools: wp-cli

      - name: Install WordPress
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wordpress
          cd /tmp/wordpress
          wp core download --skip-content --force
          wp config create             --dbname=wordpress             --dbuser=root             --dbpass=root             --dbhost=127.0.0.1:3306             --skip-check
          wp core install             --url=http://example.test             --title="Asosyoloji Theme Test"             --admin_user=admin             --admin_password=admin123456             --admin_email=admin@example.test             --skip-email

      - name: Install and activate theme
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wordpress/wp-content/themes/asosyoloji
          rsync -a ./ /tmp/wordpress/wp-content/themes/asosyoloji/             --exclude '.git'             --exclude '.github'             --exclude 'build'             --exclude 'vendor'             --exclude 'node_modules'
          cd /tmp/wordpress
          wp theme activate asosyoloji
          wp theme status asosyoloji
          wp eval 'if ( "Asosyoloji" !== wp_get_theme()->get( "Name" ) ) { exit( 1 ); } echo "Theme activation OK\n";'
          wp eval 'require_once ABSPATH . WPINC . "/class-wp-customize-manager.php"; $manager = new WP_Customize_Manager(); do_action( "customize_register", $manager ); if ( ! $manager->get_setting( "aso_home_global_exclude_categories" ) || ! $manager->get_setting( "aso_logo_width_mobile" ) ) { fwrite( STDERR, "Customizer registration failed\n" ); exit( 1 ); } echo "Customizer registration OK\n";'
          wp eval 'if ( ! WP_Block_Type_Registry::get_instance()->is_registered( "asosyoloji/post-list" ) ) { fwrite( STDERR, "Theme block registration failed\n" ); exit( 1 ); } echo "Block registration OK\n";'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium

      - name: Smoke render and responsive browser test
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/wordpress
          NORMAL_CAT=$(wp term create category "Yazılar" --slug=yazilar --porcelain)
          NOTICE_CAT=$(wp term create category "Duyurular" --slug=duyurular --porcelain)
          for i in 1 2 3 4 5 6 7 8 9; do
            wp post create --post_type=post --post_status=publish --post_title="Smoke Normal Yazı $i" --post_content="<p>Normal test içerik $i.</p><h2>Bölüm A $i</h2><p>İçerik.</p><h2>Bölüm B $i</h2><p>İçerik.</p><h3>Alt Bölüm $i</h3><p>İçerik.</p>" --post_category="$NORMAL_CAT"
          done
          wp post create --post_type=post --post_status=publish --post_title="Smoke Duyuru Gizli" --post_content="<p>Duyuru içerik.</p>" --post_category="$NOTICE_CAT"
          FRONT_ID=$(wp post create --post_type=page --post_status=publish --post_title="Ana Sayfa" --porcelain)
          wp option update home http://127.0.0.1:8080
          wp option update siteurl http://127.0.0.1:8080
          wp option update show_on_front page
          wp option update page_on_front "$FRONT_ID"
          wp eval "set_theme_mod( 'aso_home_global_exclude_categories', array( $NOTICE_CAT ) );"
          php -S 127.0.0.1:8080 -t /tmp/wordpress >/tmp/wp-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 3
          curl --fail --silent --show-error http://127.0.0.1:8080/ >/tmp/home.html
          grep -q "ASOSYOLOJİ\|Asosyoloji" /tmp/home.html
          grep -q "Smoke Normal Yazı" /tmp/home.html
          curl --fail --silent --show-error http://127.0.0.1:8080/llms.txt | grep -q "Asosyoloji"
          if grep -q "Smoke Duyuru Gizli" /tmp/home.html; then
            echo "Excluded announcement category leaked into homepage."
            exit 1
          fi
          cd "$GITHUB_WORKSPACE"
          node tests/responsive-smoke.mjs
