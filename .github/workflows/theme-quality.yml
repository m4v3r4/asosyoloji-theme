name: Theme Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './vendor/*' -print0 |
            xargs -0 -n1 php -l

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax check
        shell: bash
        run: |
          set -euo pipefail
          find assets/js -type f -name '*.js' -print0 |
            xargs -0 -n1 node --check

  phpcs:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none

      - name: Install coding standards
        run: composer install --no-interaction --prefer-dist

      - name: WordPress Coding Standards report
        run: composer phpcs

  package:
    runs-on: ubuntu-latest
    needs: syntax
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build installable ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/asosyoloji
          rsync -a ./ build/asosyoloji/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'build' \
            --exclude '.gitignore' \
            --exclude 'composer.json' \
            --exclude 'composer.lock' \
            --exclude 'phpcs.xml.dist' \
            --exclude 'bin' \
            --exclude 'vendor' \
            --exclude 'node_modules'
          cd build
          zip -qr asosyoloji-theme.zip asosyoloji

      - name: Verify ZIP
        shell: bash
        run: |
          test -s build/asosyoloji-theme.zip
          unzip -t build/asosyoloji-theme.zip
