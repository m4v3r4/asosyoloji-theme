name: Sync Theme Assets

on:
  push:
    branches: [main]
    paths:
      - '**/*.php'
      - 'assets/js/*.js'
      - 'style.css'
      - 'theme.json'
      - '.github/workflows/sync-theme-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP and WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none
          tools: wp-cli

      - name: Generate POT
        shell: bash
        run: |
          mkdir -p languages
          wp i18n make-pot . languages/asosyoloji.pot             --domain=asosyoloji             --exclude=vendor,node_modules,build,.git,.github

      - name: Generate theme screenshot
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          cat > /tmp/asosyoloji-preview.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
            <rect width="1200" height="900" fill="#ffffff"/>
            <rect width="1200" height="8" fill="#8f1d2c"/>
            <text x="64" y="150" font-family="Arial, Helvetica, sans-serif" font-size="108" font-weight="900" letter-spacing="-7" fill="#111111">ASOSYOLOJİ</text>
            <line x1="64" y1="192" x2="1136" y2="192" stroke="#d8d8d8" stroke-width="2"/>
            <text x="64" y="230" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#111111">YAZILAR   SÖYLEŞİLER   ÇEVİRİ   ARŞİV   HAKKIMIZDA</text>
            <line x1="64" y1="260" x2="1136" y2="260" stroke="#d8d8d8" stroke-width="2"/>
            <rect x="64" y="310" width="650" height="390" fill="#f5f3ef"/>
            <rect x="88" y="334" width="602" height="342" fill="#dedbd5"/>
            <rect x="760" y="310" width="376" height="390" fill="#ffffff"/>
            <text x="760" y="354" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" fill="#8f1d2c">ÖNE ÇIKAN</text>
            <text x="760" y="410" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="900" fill="#111111">Düşünce, kültür</text>
            <text x="760" y="465" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="900" fill="#111111">ve toplum için</text>
            <text x="760" y="520" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="900" fill="#111111">editoryal tema</text>
            <text x="760" y="580" font-family="Georgia, serif" font-size="22" fill="#666666">Asosyoloji WordPress Theme</text>
            <line x1="64" y1="750" x2="1136" y2="750" stroke="#111111" stroke-width="2"/>
            <text x="64" y="800" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#111111">GPL-3.0-or-later · Özgür WordPress teması</text>
          </svg>
          SVG
          convert -background white /tmp/asosyoloji-preview.svg screenshot.png

      - name: Commit generated assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add languages/asosyoloji.pot screenshot.png
          if git diff --cached --quiet; then
            echo "Generated assets are already current."
            exit 0
          fi
          git commit -m "chore: sync generated theme assets"
          git push
